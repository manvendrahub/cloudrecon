server.port=8080
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ---- MySQL (default). Change the user and password to yours, or set the DB_USER / DB_PASSWORD environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cloudrecon?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:kusu}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.storage-dir=./data/files
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Change in production. Must be at least 32 characters.
app.jwt-secret=${JWT_SECRET:change-this-development-secret-key-32chars-min}
app.jwt-ttl-hours=12
# Python AI service (generative reconstruction + report). Empty = weaker built-in Java engine.
app.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}
